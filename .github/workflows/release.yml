name: Release AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar dependencias
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Generar proyecto Android
        run: npx cap add android

      - name: Parches (permisos, SDK 35, firma)
        run: node scripts/patch-android.mjs

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Decodificar keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Compilar AAB firmado
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: '1.0.0'

      - name: Renombrar AAB
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/mis-finanzas.aab

      - name: Subir AAB
        uses: actions/upload-artifact@v4
        with:
          name: mis-finanzas-aab
          path: artifacts/mis-finanzas.aab
          if-no-files-found: error

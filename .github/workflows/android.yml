name: Build APK (Android)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar dependencias
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Generar proyecto Android
        run: npx cap add android

      - name: Permisos (notificaciones y alarmas exactas)
        run: node scripts/patch-android.mjs

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/mis-finanzas.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mis-finanzas-apk
          path: artifacts/mis-finanzas.apk
          if-no-files-found: error
